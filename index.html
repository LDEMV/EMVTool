<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMV Toolbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", Consolas, monospace;
        }

        body {
            background-color: #F5F5F5;
            color: #333;
            line-height: 1.6;
        }

        /* Top Navigation */
        .header {
            background-color: #4285F4; /* Light blue */
            color: white;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
        }

        /* Main Container with Sidebar and Content */
        .main-container {
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        
        /* Left Sidebar */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .sidebar-menu {
            padding: 8px 0;
            flex: 1;
        }
        
        /* Menu Category */
        .menu-category {
            margin-bottom: 4px;
        }
        
        .category-header {
            width: 100%;
            padding: 8px 16px;
            text-align: left;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            display: flex;
            align-items: center;
            transition: background-color 0.2s ease;
        }
        
        .category-header:hover {
            background-color: #f5f5f5;
        }
        
        .category-header .arrow {
            margin-right: 8px;
            transition: transform 0.2s ease;
            font-size: 12px;
        }
        
        .category-header.collapsed .arrow {
            transform: rotate(-90deg);
        }
        
        .category-items {
            display: block;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .category-items.collapsed {
            display: none;
        }
        
        .menu-item {
            width: 100%;
            padding: 8px 16px 8px 40px;
            text-align: left;
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            color: #555;
            display: block;
        }
        
        .menu-item:hover {
            background-color: #E8F0FE;
            color: #3367D6;
        }
        
        .menu-item.active {
            background-color: #3367D6;
            color: white;
        }
        
        /* Right Content Area */
        .content-area {
            flex: 1;
            padding: 24px;
            background-color: #F5F5F5;
            overflow-y: auto;
        }
        
        .content-area h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        /* Content Section */
        .content-section {
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Shared form styles */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
            flex: 1;
            min-width: 200px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: Consolas, monospace;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Button groups */
        .btn-group {
            margin: 16px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: #4285F4;
            color: white;
        }

        .btn-primary:hover {
            background-color: #3367D6;
        }

        .btn-secondary {
            background-color: #6c757d; /* Gray */
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268; /* Darker gray */
        }

        /* Output areas */
        .output-area {
            margin-top: 10px;
            padding: 16px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            min-height: 50px;
            font-family: Consolas, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }

        /* TLV Viewer Styles */
        .tlv-viewer .input-section {
            margin-bottom: 20px;
        }

        .tlv-viewer .button-group {
            margin: 16px 0;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tlv-viewer .button-group button {
            padding: 8px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .tlv-viewer .button-group button:first-child {
            background-color: #4285F4;
            color: white;
        }

        .tlv-viewer .button-group button:first-child:hover {
            background-color: #3367D6;
        }

        .tlv-viewer .button-group button:not(:first-child) {
            background-color: #6c757d; /* Gray */
            color: white;
        }

        .tlv-viewer .button-group button:not(:first-child):hover {
            background-color: #5a6268; /* Darker gray */
        }

        .tlv-viewer .output-section h3 {
            margin-bottom: 8px;
        }

        .tree-output {
            margin-top: 20px;
            padding: 16px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            min-height: 180px;
            font-family: Consolas, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 500px;
            overflow-y: auto;
        }

        /* Bit Parser Sub Tabs */
        .bit-parser-sub-tabs {
            display: flex;
            background-color: #E8F0FE;
            border-radius: 4px 4px 0 0;
            overflow: hidden;
            margin-bottom: 16px;
        }
        
        .bit-parser-sub-tab-btn {
            padding: 8px 16px;
            background-color: #E8F0FE;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            color: #5f6368;
        }
        
        .bit-parser-sub-tab-btn.active {
            background-color: #3367D6;
            color: white;
        }
        
        .bit-parser-sub-tab-btn:hover:not(.active) {
            background-color: #D2E3FC;
        }
        
        .bit-parser-sub-tab-content {
            display: none;
        }
        
        .bit-parser-sub-tab-content.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 16px;
            }

            .tab-btn {
                padding: 10px 12px;
                font-size: 12px;
            }
            
            .bit-parser-sub-tab-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .container {
                margin: 16px auto;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="header">
        <h1>EMV Toolbox</h1>
    </div>

    <!-- Main Container with Sidebar and Content -->
    <div class="main-container">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="sidebar-menu">
                <!-- Basic Calculators Category -->
                <div class="menu-category">
                    <button class="category-header" data-category="basic">
                        <span class="arrow">▼</span>
                        <span>Basic calculators</span>
                    </button>
                    <div class="category-items" data-category-content="basic">
                        <button class="menu-item" data-section="des">DES calculator</button>
                        <button class="menu-item" data-section="aes">AES calculator</button>
                        <button class="menu-item" data-section="bitwise">Bitwise calculator</button>
                        <button class="menu-item" data-section="base64">Base64 calculator</button>
                    </div>
                </div>
                
                <!-- Hashes Category -->
                <div class="menu-category">
                    <button class="category-header" data-category="hashes">
                        <span class="arrow">▼</span>
                        <span>Hashes</span>
                    </button>
                    <div class="category-items" data-category-content="hashes">
                        <button class="menu-item active" data-section="sha1">SHA-1</button>
                        <button class="menu-item" data-section="sha256">SHA-256</button>
                        <button class="menu-item" data-section="md5">MD5</button>
                    </div>
                </div>
                
                <!-- EMV Tools Category -->
                <div class="menu-category">
                    <button class="category-header" data-category="emv">
                        <span class="arrow">▼</span>
                        <span>EMV Tools</span>
                    </button>
                    <div class="category-items" data-category-content="emv">
                        <button class="menu-item" data-section="tlv">EMV TLV Parser</button>
                        <button class="menu-item" data-section="bit-decode">Bit Decoder</button>
                        <button class="menu-item" data-section="bit-encode">Bit Encoder</button>
                    </div>
                </div>
                
                <!-- String Tools Category -->
                <div class="menu-category">
                    <button class="category-header" data-category="string">
                        <span class="arrow">▼</span>
                        <span>String Tools</span>
                    </button>
                    <div class="category-items" data-category-content="string">
                        <button class="menu-item" data-section="string-tools">String Converter</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Content Area -->
        <div class="content-area">
            <!-- SHA-1 Section -->
            <div class="content-section active" id="sha1">
                <h2>SHA-1 Hash Calculator</h2>
                <div id="sha1-container"></div>
            </div>
            
            <!-- SHA-256 Section -->
            <div class="content-section" id="sha256">
                <h2>SHA-256 Hash Calculator</h2>
                <div id="sha256-container"></div>
            </div>
            
            <!-- MD5 Section -->
            <div class="content-section" id="md5">
                <h2>MD5 Hash Calculator</h2>
                <div id="md5-container"></div>
            </div>
            
            <!-- DES Section -->
            <div class="content-section" id="des">
                <h2>DES Calculator</h2>
                <div id="des-container"></div>
            </div>
            
            <!-- AES Section -->
            <div class="content-section" id="aes">
                <h2>AES Calculator</h2>
                <div id="aes-container"></div>
            </div>
            
            <!-- Bitwise Section -->
            <div class="content-section" id="bitwise">
                <h2>Bitwise Calculator</h2>
                <div id="bitwise-container"></div>
            </div>
            
            <!-- Base64 Section -->
            <div class="content-section" id="base64">
                <h2>Base64 Calculator</h2>
                <div id="base64-container"></div>
            </div>
            
            <!-- TLV Parser Section -->
            <div class="content-section" id="tlv">
                <h2>EMV TLV Parser</h2>
                <div id="tlv-viewer-container"></div>
            </div>

            <!-- Bit Decode Section -->
            <div class="content-section" id="bit-decode">
                <h2>Bit Decoder</h2>
                <div id="bit-decode-container"></div>
            </div>
            
            <!-- Bit Encode Section -->
            <div class="content-section" id="bit-encode">
                <h2>Bit Encoder</h2>
                <div id="bit-encode-container"></div>
            </div>
       
            <!-- String Tools Section -->
            <div class="content-section" id="string-tools">
                <h2>String Tools</h2>
                <div id="string-tools-container"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import all components
        import { TLVViewer } from './src/tlv-viewer.js';
        import { StringTools } from './src/string-tools.js';
        import { SHA1Tool } from './src/algorithms/sha1-tool.js';
        import { SHA256Tool } from './src/algorithms/sha256-tool.js';
        import { MD5Tool } from './src/algorithms/md5-tool.js';
        import { DESTool } from './src/algorithms/des-tool.js';
        import { AESTool } from './src/algorithms/aes-tool.js';
        import { Base64Tool } from './src/algorithms/base64-tool.js';
        import { BitwiseTool } from './src/algorithms/bitwise-tool.js';
        import { BitDecodeTool } from './src/bit-parser/bit-decode-tool.js';
        import { BitEncodeTool } from './src/bit-parser/bit-encode-tool.js';

        // Initialize all components
        const tlvViewer = new TLVViewer('tlv-viewer-container');
        const stringTools = new StringTools('string-tools-container');
        const sha1Tool = new SHA1Tool('sha1-container');
        const sha256Tool = new SHA256Tool('sha256-container');
        const md5Tool = new MD5Tool('md5-container');
        const desTool = new DESTool('des-container');
        const aesTool = new AESTool('aes-container');
        const base64Tool = new Base64Tool('base64-container');
        const bitwiseTool = new BitwiseTool('bitwise-container');
        const bitDecodeTool = new BitDecodeTool('bit-decode-container');
        const bitEncodeTool = new BitEncodeTool('bit-encode-container');

        // Category collapse/expand logic
        const categoryHeaders = document.querySelectorAll('.category-header');
        categoryHeaders.forEach(header => {
            header.addEventListener('click', () => {
                const categoryName = header.getAttribute('data-category');
                const categoryContent = document.querySelector(`[data-category-content="${categoryName}"]`);
                
                header.classList.toggle('collapsed');
                categoryContent.classList.toggle('collapsed');
            });
        });

        // Menu item switching logic
        const menuItems = document.querySelectorAll('.menu-item');
        const contentSections = document.querySelectorAll('.content-section');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                // Remove all active states
                menuItems.forEach(i => i.classList.remove('active'));
                contentSections.forEach(s => s.classList.remove('active'));
                
                // Activate current item
                item.classList.add('active');
                const sectionId = item.getAttribute('data-section');
                document.getElementById(sectionId).classList.add('active');
            });
        });

        // Clear button general logic
        function bindClearBtn(btnId, inputIds) {
            document.getElementById(btnId).addEventListener('click', () => {
                inputIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
                        el.value = '';
                    } else {
                        el.textContent = '';
                    }
                });
            });
        }
    </script>
    
    <!-- Footer -->
    <footer style="text-align: center; padding: 20px; color: #666; font-size: 14px;">
        <p>© 2025-2026 landicorp</p>
    </footer>
</body>
</html>
